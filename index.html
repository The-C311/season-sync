<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Sync</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Season Sync</h1>
        <p>Find out how much you need to watch each day before
            a show's new season premieres.
        </p>
    </header>

    <main>
        <section>
            <h2>Create a Rewatch Plan</h2>

            <form id="rewatch-form">
                <div>
                    <label for="show-name">Show name</label>
                    <input
                        type="text"
                        id="show-name"
                        required
                    >
                </div>

                <div>
                    <label for="season-count">
                        Number of seasons to rewatch
                    </label>
                    <input
                        type="number"
                        id="season-count"
                        name="season-count"
                        min="1"
                        required
                    >
                </div>

                <div>
                    <label for="episode-count">
                        Total number of episodes
                    </label>
                    <input
                        type="number"
                        id="episode-count"
                        name="episode-count"
                        min="1"
                        required
                    >
                </div>

                <div>
                    <label for="episode-length">
                        Average episode length in minutes
                    </label>
                    <input
                        type="number"
                        id="episode-length"
                        name="episode-length"
                        min="1"
                        required
                    >
                </div>

                <div>
                    <label for="release-date">
                        New season release date
                    </label>
                    <input
                        type="date"
                        id="release-date"
                        name="release-date"
                        required
                    >
                </div>

                <button type="submit">
                    Calculate Rewatch Plan
                </button>
            </form>
        </section>
        
        <section>
            <h2>Your Rewatch Plan</h2>

            <p id="watch-time-result" role="status">
                Enter your show's information to calculate total watch time.
            </p>
        </section>
    </main>

    <footer>
        <p>Created by Marcellus Hall</p>
    </footer>
</body>
</html>
